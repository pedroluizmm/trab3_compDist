# Incluido pelo nginx.conf fornecido pela imagem oficial.
# O pool vem de config/instancias/<WP_INSTANCIAS>.conf (1, 2 ou 3 WordPress).
upstream aplicacao_http {
    include /etc/nginx/instancias.conf;
    keepalive 12;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /saude-proxy {
        access_log off;
        default_type text/plain;
        return 200 "proxy ativo\n";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header X-Upstream $upstream_addr always;
        proxy_pass http://aplicacao_http;
    }
}
