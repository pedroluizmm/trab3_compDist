# Limita processos Apache/PHP por instancia (WP_MAX_WORKERS no Compose).
# Mantem a memoria dentro de WP_MEMORIA e as conexoes abaixo do max_connections do MySQL.
<IfModule mpm_prefork_module>
	StartServers			 5
	MinSpareServers		  5
	MaxSpareServers		 10
	MaxRequestWorkers	  ${WP_MAX_WORKERS}
	MaxConnectionsPerChild   0
</IfModule>
