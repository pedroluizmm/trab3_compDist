name: ${COMPOSE_PROJECT_NAME:-trabalho3-experimento}
services:
  database:
    image: mysql:5.7
    platform: linux/amd64
    # max-connections cobre 3 instancias x WP_MAX_WORKERS (25) com folga.
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=100"]
    environment:
      MYSQL_DATABASE: experimento
      MYSQL_USER: aplicacao
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/senha_root
      MYSQL_PASSWORD_FILE: /run/secrets/senha_aplicacao
    secrets:
      - senha_root
      - senha_aplicacao
    volumes:
      - type: bind
        source: ./data/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: false
    networks: [persistencia]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/senha_aplicacao)"
          mysql --user=aplicacao --host=127.0.0.1 --database=experimento
          --execute='SELECT 1' >/dev/null 2>&1
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 60

  wordpress1:
    image: wordpress:5.4.2-php7.2-apache
    user: "${LOCAL_UID:?Execute scripts/preparar.py}:${LOCAL_GID:?Execute scripts/preparar.py}"
    entrypoint: ["/bin/sh", "/opt/experimento/abrir-wordpress.sh"]
    # Cada instancia emula um servidor pequeno; sem limite, uma unica instancia usaria toda a CPU do host.
    cpus: ${WP_CPUS:-1.0}
    mem_limit: ${WP_MEMORIA:-1536m}
    environment:
      APACHE_RUN_USER: "#${LOCAL_UID}"
      APACHE_RUN_GROUP: "#${LOCAL_GID}"
      WP_DATABASE: experimento
      WP_USER: aplicacao
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8086}
      WP_MAX_WORKERS: ${WP_MAX_WORKERS:-25}
    secrets:
      - senha_aplicacao
      - semente_sessao
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./html
        target: /var/www/html
        bind:
          create_host_path: false
      - type: bind
        source: ./config/wordpress.php
        target: /var/www/html/wp-config.php
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/abrir-wordpress.sh
        target: /opt/experimento/abrir-wordpress.sh
        read_only: true
      - type: bind
        source: ./config/apache/mpm_prefork.conf
        target: /etc/apache2/mods-available/mpm_prefork.conf
        read_only: true
    networks: [requisicoes, persistencia]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-includes/version.php') && @fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress2:
    image: wordpress:5.4.2-php7.2-apache
    user: "${LOCAL_UID:?Execute scripts/preparar.py}:${LOCAL_GID:?Execute scripts/preparar.py}"
    entrypoint: ["/bin/sh", "/opt/experimento/abrir-wordpress.sh"]
    # Cada instancia emula um servidor pequeno; sem limite, uma unica instancia usaria toda a CPU do host.
    cpus: ${WP_CPUS:-1.0}
    mem_limit: ${WP_MEMORIA:-1536m}
    environment:
      APACHE_RUN_USER: "#${LOCAL_UID}"
      APACHE_RUN_GROUP: "#${LOCAL_GID}"
      WP_DATABASE: experimento
      WP_USER: aplicacao
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8086}
      WP_MAX_WORKERS: ${WP_MAX_WORKERS:-25}
    secrets:
      - senha_aplicacao
      - semente_sessao
    depends_on:
      wordpress1:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./html
        target: /var/www/html
        bind:
          create_host_path: false
      - type: bind
        source: ./config/wordpress.php
        target: /var/www/html/wp-config.php
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/abrir-wordpress.sh
        target: /opt/experimento/abrir-wordpress.sh
        read_only: true
      - type: bind
        source: ./config/apache/mpm_prefork.conf
        target: /etc/apache2/mods-available/mpm_prefork.conf
        read_only: true
    networks: [requisicoes, persistencia]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-includes/version.php') && @fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress3:
    image: wordpress:5.4.2-php7.2-apache
    user: "${LOCAL_UID:?Execute scripts/preparar.py}:${LOCAL_GID:?Execute scripts/preparar.py}"
    entrypoint: ["/bin/sh", "/opt/experimento/abrir-wordpress.sh"]
    # Cada instancia emula um servidor pequeno; sem limite, uma unica instancia usaria toda a CPU do host.
    cpus: ${WP_CPUS:-1.0}
    mem_limit: ${WP_MEMORIA:-1536m}
    environment:
      APACHE_RUN_USER: "#${LOCAL_UID}"
      APACHE_RUN_GROUP: "#${LOCAL_GID}"
      WP_DATABASE: experimento
      WP_USER: aplicacao
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8086}
      WP_MAX_WORKERS: ${WP_MAX_WORKERS:-25}
    secrets:
      - senha_aplicacao
      - semente_sessao
    depends_on:
      wordpress2:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./html
        target: /var/www/html
        bind:
          create_host_path: false
      - type: bind
        source: ./config/wordpress.php
        target: /var/www/html/wp-config.php
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/abrir-wordpress.sh
        target: /opt/experimento/abrir-wordpress.sh
        read_only: true
      - type: bind
        source: ./config/apache/mpm_prefork.conf
        target: /etc/apache2/mods-available/mpm_prefork.conf
        read_only: true
    networks: [requisicoes, persistencia]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-includes/version.php') && @fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:1.19.0
    depends_on:
      wordpress3:
        condition: service_healthy
    ports:
      - target: 80
        published: "${HTTP_PORT:-8086}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/balanceamento.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/instancias/${WP_INSTANCIAS:-3}.conf
        target: /etc/nginx/instancias.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./html
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    networks: [requisicoes]

  # Gerador de carga (Trabalho 3). Alvo: nome do servico Nginx na rede do Compose.
  # Interativo: docker compose --profile carga up locust -> http://127.0.0.1:8089
  # Medicoes: scripts/experimento.py executa-o em modo headless.
  locust:
    image: locustio/locust:2.46.7
    profiles: [carga]
    user: "${LOCAL_UID}:${LOCAL_GID}"
    command: ["-f", "/mnt/locust/locustfile.py"]
    environment:
      LOCUST_HOST: http://nginx
      CENARIO: ${CENARIO:-imagem-1mb}
      ESPERA_MIN: ${ESPERA_MIN:-5}
      ESPERA_MAX: ${ESPERA_MAX:-9}
    cpus: ${LOCUST_CPUS:-4.0}
    depends_on: [nginx]
    ports:
      - target: 8089
        published: "8089"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ./locust
        target: /mnt/locust
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./resultados
        target: /mnt/resultados
    networks: [requisicoes]

  # Consolidacao e graficos com versoes fixadas (o host nao precisa de matplotlib).
  analise:
    build: ./docker/analise
    image: trabalho3-analise:1
    profiles: [ferramentas]
    user: "${LOCAL_UID}:${LOCAL_GID}"
    working_dir: /projeto
    volumes:
      - type: bind
        source: ./scripts
        target: /projeto/scripts
        read_only: true
      - type: bind
        source: ./resultados
        target: /projeto/resultados
    network_mode: none

networks:
  requisicoes:
  persistencia:
    internal: true

secrets:
  senha_root:
    file: ./segredos/senha_root
  senha_aplicacao:
    file: ./segredos/senha_aplicacao
  semente_sessao:
    file: ./segredos/semente_sessao
